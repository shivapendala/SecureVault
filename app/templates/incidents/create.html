{% extends "base.html" %}

{% block title %}Escalate Incident - SecureVault{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-lg-8">
        <div class="cyber-card p-4">
            <div class="d-flex align-items-center justify-content-between mb-4 pb-2 border-bottom border-secondary border-opacity-25">
                <div>
                    <h3 class="text-white mb-1"><i class="bi bi-exclamation-octagon text-danger me-2"></i>Escalate SOC Incident Ticket</h3>
                    <p class="text-muted small mb-0">Trigger Tier-2/3 incident containment playbooks, IOC indexing, and team assignments.</p>
                </div>
                <a href="{{ url_for('incidents.index') }}" class="btn btn-sm btn-cyber-outline">
                    <i class="bi bi-arrow-left me-1"></i>Back to Board
                </a>
            </div>

            <form method="POST" action="{{ url_for('incidents.create') }}">
                <div class="row g-3">
                    <div class="col-12 col-md-8">
                        <label class="form-label text-muted small fw-semibold">Incident Title *</label>
                        <input type="text" name="title" class="form-control cyber-input" placeholder="e.g. Distributed Credential Stuffing on Active Directory" required autofocus>
                    </div>

                    <div class="col-12 col-md-4">
                        <label class="form-label text-muted small fw-semibold">Severity Rating *</label>
                        <select name="severity" class="form-select cyber-input" required>
                            <option value="Critical">Critical (P1 - Immediate Containment)</option>
                            <option value="High" selected>High (P2 - 4h SLA)</option>
                            <option value="Medium">Medium (P3)</option>
                            <option value="Low">Low (P4)</option>
                        </select>
                    </div>

                    <div class="col-12">
                        <label class="form-label text-muted small fw-semibold">Incident Scope & Attack Vector *</label>
                        <textarea name="description" class="form-control cyber-input" rows="3" placeholder="Explain the alert trigger, affected hosts, detection vectors..." required></textarea>
                    </div>

                    <div class="col-12 col-md-6">
                        <label class="form-label text-muted small fw-semibold">Attributed Threat Actor / Group</label>
                        <input type="text" name="threat_actor" class="form-control cyber-input" value="Unknown / Unattributed" placeholder="e.g. APT29, Ransomware Affiliate">
                    </div>

                    <div class="col-12 col-md-6">
                        <label class="form-label text-muted small fw-semibold">MITRE ATT&CK Technique</label>
                        <input type="text" name="mitre_technique" class="form-control cyber-input" value="T1110 - Brute Force" placeholder="e.g. T1059 - Command and Scripting Interpreter">
                    </div>

                    <div class="col-12 col-md-6">
                        <label class="form-label text-muted small fw-semibold">Lead SOC Investigator</label>
                        <select name="assigned_to_id" class="form-select cyber-input">
                            {% for u in users %}
                            <option value="{{ u.id }}">{{ u.full_name or u.username }} ({{ u.role }})</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-12 col-md-6">
                        <label class="form-label text-muted small fw-semibold">Indicators of Compromise (IOCs)</label>
                        <input type="text" name="iocs" class="form-control cyber-input mono-text" placeholder="IP addresses, hashes, malicious domains...">
                    </div>
                </div>

                <div class="mt-4 pt-3 border-top border-secondary border-opacity-25 d-flex justify-content-end gap-2">
                    <a href="{{ url_for('incidents.index') }}" class="btn btn-cyber-outline">Cancel</a>
                    <button type="submit" class="btn btn-cyber-primary">
                        <i class="bi bi-shield-exclamation me-1"></i>Publish & Dispatch Ticket
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
