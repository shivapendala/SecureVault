{% extends "base.html" %}

{% block title %}Log Vulnerability - SecureVault{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-lg-8">
        <div class="cyber-card p-4">
            <div class="d-flex align-items-center justify-content-between mb-4 pb-2 border-bottom border-secondary border-opacity-25">
                <div>
                    <h3 class="text-white mb-1"><i class="bi bi-bug text-danger me-2"></i>Log Security Vulnerability</h3>
                    <p class="text-muted small mb-0">Record discovered CVEs, zero-days, or internal pentest findings.</p>
                </div>
                <a href="{{ url_for('vulnerabilities.index') }}" class="btn btn-sm btn-cyber-outline">
                    <i class="bi bi-arrow-left me-1"></i>Back to CVE Board
                </a>
            </div>

            <form method="POST" action="{{ url_for('vulnerabilities.create') }}">
                <div class="row g-3">
                    <div class="col-12 col-md-4">
                        <label class="form-label text-muted small fw-semibold">CVE ID / Advisory *</label>
                        <input type="text" name="cve_id" class="form-control cyber-input mono-text" placeholder="CVE-2026-XXXX" required autofocus>
                    </div>

                    <div class="col-12 col-md-8">
                        <label class="form-label text-muted small fw-semibold">Vulnerability Title *</label>
                        <input type="text" name="title" class="form-control cyber-input" placeholder="e.g. Remote Code Execution in Web App Gateway" required>
                    </div>

                    <div class="col-12">
                        <label class="form-label text-muted small fw-semibold">Vulnerability Technical Summary *</label>
                        <textarea name="description" class="form-control cyber-input" rows="3" placeholder="Technical root cause, exploit vectors, affected packages..." required></textarea>
                    </div>

                    <div class="col-12 col-md-4">
                        <label class="form-label text-muted small fw-semibold">Severity Rating</label>
                        <select name="severity" class="form-select cyber-input" required>
                            <option value="Critical">Critical (CVSS 9.0 - 10.0)</option>
                            <option value="High" selected>High (CVSS 7.0 - 8.9)</option>
                            <option value="Medium">Medium (CVSS 4.0 - 6.9)</option>
                            <option value="Low">Low (CVSS 0.1 - 3.9)</option>
                        </select>
                    </div>

                    <div class="col-12 col-md-4">
                        <label class="form-label text-muted small fw-semibold">CVSS v3.1 Base Score</label>
                        <input type="number" step="0.1" min="0.0" max="10.0" name="cvss_score" class="form-control cyber-input" value="7.5">
                    </div>

                    <div class="col-12 col-md-4">
                        <label class="form-label text-muted small fw-semibold">Affected Target Asset</label>
                        <select name="affected_asset_id" class="form-select cyber-input">
                            <option value="">-- Unassigned / Global --</option>
                            {% for asset in assets %}
                            <option value="{{ asset.id }}">{{ asset.name }} ({{ asset.asset_type }})</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-12 col-md-8">
                        <label class="form-label text-muted small fw-semibold">MITRE ATT&CK Tactic</label>
                        <input type="text" name="mitre_tactic" class="form-control cyber-input" value="Initial Access & Execution" placeholder="e.g. Privilege Escalation, Defense Evasion">
                    </div>

                    <div class="col-12 col-md-4 d-flex align-items-center">
                        <div class="form-check mt-4">
                            <input class="form-check-input bg-dark border-secondary" type="checkbox" name="exploit_available" id="exploitCheck">
                            <label class="form-check-label text-danger small fw-semibold" for="exploitCheck">
                                <i class="bi bi-fire me-1"></i>Public Exploit PoC Exists
                            </label>
                        </div>
                    </div>

                    <div class="col-12">
                        <label class="form-label text-muted small fw-semibold">Remediation & Patch Guidance</label>
                        <textarea name="remediation_guidance" class="form-control cyber-input" rows="3" placeholder="Vendor patches, configuration workarounds, firewall rule updates..."></textarea>
                    </div>
                </div>

                <div class="mt-4 pt-3 border-top border-secondary border-opacity-25 d-flex justify-content-end gap-2">
                    <a href="{{ url_for('vulnerabilities.index') }}" class="btn btn-cyber-outline">Cancel</a>
                    <button type="submit" class="btn btn-cyber-primary">
                        <i class="bi bi-shield-check me-1"></i>Publish Advisory
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
