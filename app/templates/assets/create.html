{% extends "base.html" %}

{% block title %}Register Asset - SecureVault{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-lg-8">
        <div class="cyber-card p-4">
            <div class="d-flex align-items-center justify-content-between mb-4 pb-2 border-bottom border-secondary border-opacity-25">
                <div>
                    <h3 class="text-white mb-1"><i class="bi bi-hdd-stack text-info me-2"></i>Register Network / Cloud Asset</h3>
                    <p class="text-muted small mb-0">Enroll servers, cloud clusters, firewalls, and gateways into active SOC monitoring.</p>
                </div>
                <a href="{{ url_for('assets.index') }}" class="btn btn-sm btn-cyber-outline">
                    <i class="bi bi-arrow-left me-1"></i>Back to Inventory
                </a>
            </div>

            <form method="POST" action="{{ url_for('assets.create') }}">
                <div class="row g-3">
                    <div class="col-12 col-md-8">
                        <label class="form-label text-muted small fw-semibold">Asset Name / Hostname *</label>
                        <input type="text" name="name" class="form-control cyber-input" placeholder="e.g. AWS Production US-East-1 VPC" required autofocus>
                    </div>

                    <div class="col-12 col-md-4">
                        <label class="form-label text-muted small fw-semibold">Asset Category *</label>
                        <select name="asset_type" class="form-select cyber-input" required>
                            <option value="Cloud VPC">Cloud VPC</option>
                            <option value="Kubernetes Cluster">Kubernetes Cluster</option>
                            <option value="Linux Server" selected>Linux Server</option>
                            <option value="Windows AD">Windows Active Directory</option>
                            <option value="Firewall">Perimeter Firewall</option>
                            <option value="Database Cluster">Database Cluster</option>
                            <option value="API Gateway">API Gateway</option>
                        </select>
                    </div>

                    <div class="col-12 col-md-6">
                        <label class="form-label text-muted small fw-semibold">IP Address / CIDR Range</label>
                        <input type="text" name="ip_address" class="form-control cyber-input mono-text" placeholder="10.0.0.1 or 192.168.1.50">
                    </div>

                    <div class="col-12 col-md-6">
                        <label class="form-label text-muted small fw-semibold">FQDN / Domain Name</label>
                        <input type="text" name="fqdn" class="form-control cyber-input mono-text" placeholder="server01.corp.internal">
                    </div>

                    <div class="col-12 col-md-4">
                        <label class="form-label text-muted small fw-semibold">Environment Zone</label>
                        <select name="environment" class="form-select cyber-input">
                            <option value="Production" selected>Production</option>
                            <option value="Staging">Staging</option>
                            <option value="DMZ">DMZ / Perimeter</option>
                            <option value="Internal">Internal Corporate</option>
                        </select>
                    </div>

                    <div class="col-12 col-md-4">
                        <label class="form-label text-muted small fw-semibold">Asset Criticality</label>
                        <select name="criticality" class="form-select cyber-input">
                            <option value="Mission Critical">Mission Critical</option>
                            <option value="High" selected>High</option>
                            <option value="Medium">Medium</option>
                            <option value="Low">Low</option>
                        </select>
                    </div>

                    <div class="col-12 col-md-4">
                        <label class="form-label text-muted small fw-semibold">Initial Risk Score (0-100)</label>
                        <input type="number" name="risk_score" class="form-control cyber-input" value="45" min="0" max="100">
                    </div>

                    <div class="col-12 col-md-6">
                        <label class="form-label text-muted small fw-semibold">Declared Open Ports</label>
                        <input type="text" name="open_ports" class="form-control cyber-input mono-text" value="22, 80, 443" placeholder="22, 80, 443, 3306">
                    </div>

                    <div class="col-12 col-md-6">
                        <label class="form-label text-muted small fw-semibold">Asset Custodian / Team</label>
                        <input type="text" name="owner" class="form-control cyber-input" value="Cloud Infrastructure Sec">
                    </div>
                </div>

                <div class="mt-4 pt-3 border-top border-secondary border-opacity-25 d-flex justify-content-end gap-2">
                    <a href="{{ url_for('assets.index') }}" class="btn btn-cyber-outline">Cancel</a>
                    <button type="submit" class="btn btn-cyber-primary">
                        <i class="bi bi-check2-circle me-1"></i>Enroll Asset
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
